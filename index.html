<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejemplo de Bootstrap 5</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- CSS Adicional Personalizado -->
    <style>
        body {
            /* Color café claro / Beige cálido */
            background-color: #e0821d; 
        }
        .hero-header {
            position: relative;
            width: 100vw;            
            height: 580px;             
            margin-left: calc(-50vw + 50%); 
            margin-right: calc(-50vw + 50%);
            margin-bottom: 2rem; 
            
            background-image: url('img/fondomusica.png');      
            
            /* CAMBIO CLAVE AQUÍ: 'contain' muestra la imagen completa sin recortarla */
            background-size: contain;    
            background-position: center;
            
            /* Evita que la imagen se multiplique si sobra espacio */
            background-repeat: no-repeat; 
            
            /* Color de respaldo por si queda espacio a los lados */
            background-color: #2b1d14; 

            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 
        
        .hero-header {
            position: relative;
            width: 100vw;              /* Ancho total de la pantalla */
            height: 320px;             /* Alto exacto de 320 píxeles */
            margin-left: calc(-50vw + 50%); /* Rompe los márgenes de Bootstrap para tocar los bordes */
            margin-right: calc(-50vw + 50%);
            margin-bottom: 2rem; 
            
            /* CORREGIDO: Se eliminó la barra diagonal del inicio */
            background-image: url('img/fondomusica.png');      
            background-size: cover;    
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        } 
        */

        /* Capa oscura translúcida para que el texto resalte */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45); /* 45% de oscuridad */
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }
    </style>
  </head>
  <body>
    <!-- Contenedor principal que mantiene el contenido alineado -->
    <div class="container">
        
        <!-- Imagen de encabezado de ancho completo (320px de alto) -->
        <header class="hero-header">
            <div class="hero-overlay"></div>
            <div class="hero-content text-center text-white">
                <h1 class="display-5 fw-bold">Repertorio Musical Interactivo</h1>
                <p class="lead">Descubre la música, autores y su historia</p>
            </div>
        </header>

        <!-- Aquí abajo irá el resto de tu repertorio (tarjetas, etc.) -->
        <div class="row">
            <div class="col-md-12 text-center text-white">
                <p>Próximamente aquí las tarjetas de las obras musicales...</p>
            </div>
        </div>

    </div>

    <!-- JS de Bootstrap corregido con la URL completa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
