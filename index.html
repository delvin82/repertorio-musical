<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
  rel="stylesheet">
  <link href="https://www.jqueryscript.net/css/jquerysctipttop.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css" integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb" crossorigin="anonymous">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/flick/jquery-ui.css">
  <link rel="stylesheet" href="css/audio-player.css">
  <title>Musica Venezolana</title>
<style>
     body {
         /* Color café claro / Beige cálido */
         background-color: #e0821d;  
     }
     .hero-header {
         position: relative;
         width: 100vw;                     
         height: 580px;                     
         margin-left: calc(-50vw + 50%);              
         margin-right: calc(-50vw + 50%);             
         margin-bottom: 2rem;                         
         background-image: url('img/fondomusica.png');                            
         /* 'contain' muestra la imagen completa sin recortarla */
         background-size: contain;            
         background-position: center;                  
         /* Evita que la imagen se multiplique si sobra espacio */
         background-repeat: no-repeat;                 
         /* Color de respaldo por si queda espacio a los lados */
         background-color: #2b1d14;           
         display: flex;
         align-items: center;
         justify-content: center;
     }
     
     .hero-content {
         position: relative;
         z-index: 2;
     }

     /* Estilos personalizados para las tarjetas de canciones */
     .song-card {
         background-color: #fff8f0;
         border: none;
         transition: transform 0.2s ease, box-shadow 0.2s ease;
     }
     .song-card:hover {
         transform: translateY(-3px);
         box-shadow: 0 8px 20px rgba(0,0,0,0.15);
     }

     /* CORREGIDO: Reducido a la mitad de su tamaño anterior y alineados horizontalmente */
     .play-pause, #next-button {
         font-size: 5.5rem !important; /* Reducido para que se vea pequeño y estético */
         cursor: pointer;            /* Hace que aparezca la mano al pasar el mouse */
         display: inline-flex;       /* Asegura que fluyan uno al lado del otro */
         vertical-align: middle;
     }

     /* ADAPTACIÓN PARA CELULARES (Pantallas menores a 768 píxeles de ancho) */
     @media (max-width: 768px) {
         .hero-header {
             height: 180px; /* Reducimos la altura a 180px para que no sobre espacio en el celular */
         }

         .hero-header h1 {
             font-size: 1.5rem !important; 
         }
               
         .hero-header p {
             font-size: 0.9rem;
         }

         /* CORREGIDO: Tamaño adaptado para móviles manteniendo la posición horizontal */
         .play-pause, #next-button {
             font-size: 3.5rem !important;
         }
     }

     .bg-mosaico-card {
         background-image: url('https://transparenttextures.com');
         background-repeat: repeat;
         background-position: top left;
         background-size: auto; 
     }

     .bg-mosaico-card .audio-player {
         background-color: rgba(255, 255, 255, 0.92); 
         border-radius: 0.5rem;
         box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
     }
</style>
 
</head>
<body>
<!-- Imagen de encabezado -->
    <header class="hero-header">
        <div class="hero-overlay"></div>
        <div class="hero-content text-center text-white">
            <!-- Puedes poner texto aquí si lo deseas -->
        </div>
    </header>
    <!-- Listado del Repertorio de Canciones -->
     
    <main class="mb-5">        <!-- contenedor principal -->
     
        <div class="list-group shadow">
            <!-- Canción 1 (Con tu enlace de Google Drive integrado) -->
            <div class="list-group-item song-card d-flex flex-column flex-md-row justify-content-between align-items-md-center p-3 mb-2 rounded">
                <section class="audio-player card w-100" style="margin-top:20px">      
    <div class="card w-100"> 
      <div class="card text-center">
      <div class="card-header">
    <h2>Repertorio Musical Venezolano</h2>
  </div>
  </div>
      <div class="card-body">
        <!-- Contenedor de botones: Ya usan clases de Bootstrap para estar alineados horizontalmente -->
        <div class="row align-items-center mt-4 mb-3 mx-0">
          <i id="play-button" class="material-icons play-pause text-primary mr-2" aria-hidden="true">play_circle_outline</i>
          <i id="pause-button" class="material-icons play-pause d-none text-primary mr-2" aria-hidden="true">pause_circle_outline</i>
          <i id="next-button" class="material-icons text-primary ml-2 mr-3" aria-hidden="true">skip_next</i>
        </div>
        <div class="p-0 m-0" id="now-playing">
          <p class="font-italic mb-0">ahora sonando: </p>
          <p class="lead" id="title"></p>
          <p class="lead font-italic text-muted" id="sinopsis" style="font-size: 1rem;"></p>
        </div>
        <div class="progress-bar progress col-12 mb-3">
        </div>
      </div>
      <ul class="playlist list-group list-group-flush">
        <li audio_url="https://ia601800.us.archive.org/18/items/ansiedad_202610/Ansiedad.mp3"
        img_url="https://lorempixel.com/400/400/cats/1"
        sinopsis="La canción «Ansiedad» fue escrita en 1955 por el compositor venezolano José Enrique «Chelique» Sarabia, y fue grabada y popularizada por Nat King Cole en 1958 (formando parte de su álbum Cole Español / To My Friends) y lanzada internacionalmente en 1959."
        class="active list-group-item playlist-item">
        Ansiedad</li>
        
        <li audio_url="https://ia601005.us.archive.org/32/items/en-carne-viva/En%20carne%20viva.mp3"
        img_url="https://lorempixel.com/400/400/cats/4"
        sinopsis="En carne viva es el título del 23º. Álbum de estudio grabado y realizado por el artista español Raphael. Fue lanzado al mercado por la compañía discográfica Hispavox en 1981, este álbum fue producido, dirigido y orquestado por el compositor español Manuel Alejandro. La letra habla del dolor profundo, la vulnerabilidad y el desgarro emocional que deja una ruptura amorosa reciente, donde la herida sigue abierta y recordar a la otra persona resulta devastador."
        class="list-group-item playlist-item">
        En Carne Viva </li>
        
        <li audio_url="https://ia601001.us.archive.org/18/items/mi-burrito-sabanero_202610/Mi%20burrito%20Sabanero.mp3"
        img_url="https://lorempixel.com/400/400/cats/3"
        sinopsis="Conocido originalmente como «El burrito de Belén») es un famoso villancico navideño venezolano. Fue grabada primero por el folclorista venezolano Simón Díaz, incluida en su disco Las gaitas de Simón y luego se grabó con el grupo musical infantil venezolano La Rondallita en noviembre de 1975 con la voz solista del niño Ricardo Cuenci, siendo esta última versión la que alcanzó gran popularidad en varios países de Hispanoamérica y Europa."
        class="list-group-item playlist-item">
       Mi Burrito Sabanero </li>
      </ul>
      </div>
  
  <audio id="audio-player" class="d-none" src="" type="audio/mp3" controls="controls"></audio>
</section>   
</div>
</div>
</main>       
<script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha384-xBuQ/xzmlsLoJpyjoggmTEz8OWUFM0/RC5BsqQBDX2v5cMvDHcMakNTNrHIW2I5f" crossorigin="anonymous"></script>
<script src="js/jquery-ui-slider.js" charset="utf-8"></script>
<script src="js/audioPlayer.js" charset="utf-8"></script>

<script type="text/javascript">
  $(document).ready(function() {
    function actualizarSinopsis() {
      var sinopsisActual = $('.playlist-item.active').attr('sinopsis');
      if (sinopsisActual) {
        $('#sinopsis').text(sinopsisActual);
      } else {
        $('#sinopsis').text('');
      }
    }

    actualizarSinopsis();

    $('.playlist-item').on('click', function() {
      setTimeout(actualizarSinopsis, 50);
    });

    $('#next-button').on('click', function() {
      setTimeout(actualizarSinopsis, 50);
    });
  });
</script>
</body>
</html>
